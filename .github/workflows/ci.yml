name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Check formatting
        run: python -m ruff format --check app tests

      - name: Type-check stable boundaries
        run: python -m mypy app/config.py app/schemas.py

      - name: Run targeted tests
        run: python -m pytest -q
